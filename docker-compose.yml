version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: learngap_postgres
    restart: always
    environment:
      POSTGRES_USER: learngap_user
      POSTGRES_PASSWORD: learngap_secure_password_2026
      POSTGRES_DB: learngap_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U learngap_user -d learngap_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: learngap_backend
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://learngap_user:learngap_secure_password_2026@db:5432/learngap_db
      SECRET_KEY: ${SECRET_KEY:-learngap-ai-production-secret-key-32-chars-long-change-me}
      AI_PROVIDER: ${AI_PROVIDER:-rule_based}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      DEFAULT_DATA_RETENTION_DAYS: 365
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: learngap_frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  postgres_data:
